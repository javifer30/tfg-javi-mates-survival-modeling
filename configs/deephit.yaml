seed: 42

paths:
  train_path: data/processed/static/train_static.parquet
  val_path: data/processed/static/val_static.parquet
  test_path: data/processed/static/test_static.parquet
  models_dir: outputs/models
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  figures_dir: outputs/figures

model:
  name: deephit
  num_Event: 1
  num_Category: 10
  include_tail_category: true
  max_horizon_days: 10
  evaluation_time_grid: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  horizon_times: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  shared_layers: [128, 64]
  cause_layers: [64]
  dropout: 0.1
  learning_rate: 0.001
  epochs: 50
  batch_size: 256
  early_stopping_patience: 10
  alpha: 1.0
  beta: 1.0
  gamma: 0.0
  ranking_sigma: 0.1
  device: auto
  log_every: 10
  resume_from_checkpoint: null
  save_best_checkpoint: true
  save_last_checkpoint: true
  save_every_n_epochs: 5

evaluation:
  evaluation_time_grid: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  horizon_times: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  predictions_path: outputs/predictions/deephit_predictions.parquet
  weighted_c_index_path: outputs/metrics/deephit/deephit_weighted_c_index_by_horizon.csv
  antolini_ctd_path: outputs/metrics/deephit/deephit_antolini_ctd.csv
