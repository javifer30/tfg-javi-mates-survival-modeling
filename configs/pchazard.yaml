seed: 42

paths:
  train_path: data/processed/static/train_static.parquet
  val_path: data/processed/static/val_static.parquet
  test_path: data/processed/static/test_static.parquet
  models_dir: outputs/models
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  figures_dir: outputs/figures

model:
  name: pchazard
  num_durations: 10
  max_horizon_days: 10
  evaluation_time_grid: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  horizon_times: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  scheme: equidistant
  hidden_layers: [128, 64]
  dropout: 0.1
  batch_norm: true
  learning_rate: 0.001
  epochs: 50
  batch_size: 256
  early_stopping_patience: 10
  verbose: false
  device: auto

evaluation:
  evaluation_time_grid: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  horizon_times: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  weighted_c_index_path: outputs/metrics/pchazard/pchazard_weighted_c_index_by_horizon.csv
  antolini_ctd_path: outputs/metrics/pchazard/pchazard_antolini_ctd.csv
