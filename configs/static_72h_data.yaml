seed: 42

paths:
  flat_features_path: data/processed/mimic_extraction/flat_features.csv
  labels_path: data/processed/mimic_extraction/labels.csv
  processed_dir: data/processed/static_72h
  preprocessor_path: outputs/static_72h/preprocessors/static_72h_preprocessor.pkl
  summary_path: outputs/static_72h/metrics/static_72h_dataset_summary.json

columns:
  id_col: patientunitstayid
  event_col: actualhospitalmortality
  duration_col: actualiculos
  duration_unit: days
  optional_label_cols:
    - uniquepid
    - patienthealthsystemstayid

target:
  prediction_time_hours: 72
  max_horizon_days: 10

split:
  train_size: 0.60
  val_size: 0.20
  test_size: 0.20
  stratify: true

preprocessing:
  source: static_72h_pycox_dysurv_notebook_inspired
  rare_min_count: 1000
  clip_min: -5.0
  clip_max: 5.0
  drop_feature_cols:
    - nullheight
  binary_maps:
    gender:
      M: 1.0
      F: 0.0
      Male: 1.0
      Female: 0.0
  standard_cols:
    - age
    - height
    - weight
  leave_numeric_cols:
    - hour
    - eyes
    - motor
    - verbal
  categorical_cols:
    - ethnicity
    - first_careunit
    - admission_location
    - insurance
