seed: 42

paths:
  static_landmark_dir: data/processed/landmark_72h/static
  timeseries_path: data/processed/mimic_extraction/timeseries.csv
  timeserieslab_path: data/processed/mimic_extraction/timeserieslab.csv
  output_dir: data/processed/landmark_72h/dynamic
  audit_dir: outputs/landmark_72h/dynamic/audit
  preprocessor_path: data/processed/landmark_72h/dynamic/preprocessor.joblib

static:
  train_path: data/processed/landmark_72h/static/train_static_72h.parquet
  val_path: data/processed/landmark_72h/static/val_static_72h.parquet
  test_path: data/processed/landmark_72h/static/test_static_72h.parquet

temporal:
  prediction_time_hours: 72
  hours: 72
  max_offset_minutes_exclusive: 4320
  temporal_feature_min_patient_coverage: 0.05
  chunksize: 500000
  aggregation: last_measurement_within_hour
  imputation: forward_fill_then_train_median
  scaling: train_p05_p95_to_unit_interval
  clip_min: -5.0
  clip_max: 5.0

columns:
  id_col: patientunitstayid
  chart:
    offset_col: chartoffset
    feature_col: chartvaluelabel
    value_col: chartvalue
  lab:
    offset_col: labresultoffset
    feature_col: labname
    value_col: labresult
