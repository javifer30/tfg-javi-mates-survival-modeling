objective:
  primary_metric: validation_ctd_antolini
  primary_direction: maximize
  tiebreaker_metric: validation_ibll
  tiebreaker_direction: minimize

evaluation:
  horizon_times: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  evaluation_time_grid: [1, 2, 3, 4, 5, 6, 7, 8, 9]

tuning:
  seed: 42
  output_dir: outputs/tuning
  save_predictions: false
  save_models: false
  save_checkpoints: false

final:
  seeds: [42, 123, 2026]
  output_dir: outputs/final_static
  save_predictions: true
  save_models: false
  save_checkpoints: false

models:
  coxph:
    base_config: configs/coxph.yaml
    grid:
      penalizer: [0.0, 0.001, 0.01, 0.1]
      l1_ratio: [0.0]

  deepsurv:
    base_config: configs/deepsurv.yaml
    grid:
      hidden_layers:
        - [64, 32]
      dropout: [0.1]
      learning_rate: [0.001]
      weight_decay: [0.0001, 0.001]

  pchazard:
    base_config: configs/pchazard.yaml
    grid:
      hidden_layers:
        - [128, 64]
      dropout: [0.1]
      learning_rate: [0.001, 0.0005]

  deephit:
    base_config: configs/deephit.yaml
    grid:
      shared_layers:
        - [128, 64]
      cause_layers:
        - [64]
      dropout: [0.1]
      learning_rate: [0.001]
      alpha: [1.0]
      beta: [1.0, 0.5]
      gamma: [0.0]
      ranking_sigma: [0.1]
      include_tail_category: [true]
