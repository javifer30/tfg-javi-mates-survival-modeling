seed: 42

paths:
  flat_features_path: data/processed/mimic_extraction/flat_features.csv
  labels_path: data/processed/mimic_extraction/labels.csv
  processed_static_dir: data/processed/static
  preprocessor_path: outputs/preprocessors/static_preprocessor.pkl
  summary_path: outputs/metrics/static_dataset_summary.json

columns:
  id_col: patientunitstayid
  event_col: actualhospitalmortality
  duration_col: actualiculos

split:
  train_size: 0.60
  val_size: 0.20
  test_size: 0.20
  stratify: true

preprocessing:
  source: paper_like_mimic_iv_flat
  rare_min_count: 1000
  clip_min: -4.0
  clip_max: 4.0
  binary_maps:
    gender:
      M: 1.0
      F: 0.0
      Male: 1.0
      Female: 0.0
  categorical_cols:
    - ethnicity
    - first_careunit
    - admission_location
    - insurance
  standard_cols:
    - height
  minmax_cols:
    - weight
    - age
    - hour
    - eyes
    - motor
    - verbal

validation:
  allow_null_cols: []
