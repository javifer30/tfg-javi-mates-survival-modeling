seed: 42

paths:
  train_path: data/processed/static/train_static.parquet
  val_path: data/processed/static/val_static.parquet
  test_path: data/processed/static/test_static.parquet
  models_dir: outputs/models
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  figures_dir: outputs/figures

model:
  name: coxph
  penalizer: 0.1
  l1_ratio: 0.0
  num_durations: 10
  max_horizon_days: 10
  evaluation_time_grid: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  horizon_times: [1, 2, 3, 4, 5, 6, 7, 8, 9]
